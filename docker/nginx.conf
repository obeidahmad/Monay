# The web container: serves the built app and forwards /api to the engine.
#
# The browser only ever talks to this one origin — which is why the app needs
# no CORS setup and has no API address baked into its bundle. (The Vite dev
# server plays the same role during development: web/vite.config.ts.)

server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_min_length 1024;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # --- the API ---------------------------------------------------------------
    # Resolved through Docker's DNS on each request (the variable is what makes
    # nginx do that) instead of once at startup: nginx starts whether or not
    # the engine is up yet, and keeps working after the api container is
    # recreated with a new address.
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $engine http://api:8000;

    location /api/ {
        proxy_pass $engine;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # --- the app ---------------------------------------------------------------
    # Build output is fingerprinted (index-3f9a….js): a name never changes
    # content, so it can be cached for good.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        add_header X-Content-Type-Options "nosniff";
        try_files $uri =404;
    }

    # Everything else is a client-side route (/budget, /transactions, …) and
    # gets the app shell — which must be revalidated, or a new release would
    # keep loading the old bundle.
    location / {
        add_header Cache-Control "no-cache";
        add_header X-Content-Type-Options "nosniff";
        add_header X-Frame-Options "DENY";
        add_header Referrer-Policy "same-origin";
        try_files $uri /index.html;
    }
}
